name: Test Suite

on:
  push:
    branches: [main, develop, beta, nextgen]
  pull_request:
    branches: [main, develop, beta, nextgen]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Node dependencies
        run: pnpm install

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libudev-dev \
            libusb-1.0-0-dev \
            libpcsclite-dev \
            pkg-config \
            patchelf

      - name: Create dummy binaries for macOS/Linux
        run: |
          mkdir -p src-tauri/binaries

          touch src-tauri/binaries/sumatrapdf-x86_64-apple-darwin
          touch src-tauri/binaries/sumatrapdf-aarch64-apple-darwin
          touch src-tauri/binaries/sumatrapdf-x86_64-unknown-linux-gnu

          chmod +x src-tauri/binaries/*

      - name: Run Linting (Frontend & Backend)
        run: pnpm run lint:all

  test-frontend:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run Frontend Tests
        run: pnpm test:frontend

  test-backend:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Node dependencies
        run: pnpm install

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libudev-dev \
            libusb-1.0-0-dev \
            libpcsclite-dev \
            pkg-config \
            patchelf

      # Fix: Removed the matrix check since this job strictly runs on ubuntu-latest
      - name: Create dummy binaries for macOS/Linux
        run: |
          mkdir -p src-tauri/binaries

          touch src-tauri/binaries/sumatrapdf-x86_64-apple-darwin
          touch src-tauri/binaries/sumatrapdf-aarch64-apple-darwin
          touch src-tauri/binaries/sumatrapdf-x86_64-unknown-linux-gnu

          chmod +x src-tauri/binaries/*

      - name: Generate .env file for tests
        run: |
          echo "SENTRY_DSN=${{ secrets.SENTRY_DSN }}" >> src-tauri/.env
          echo "POSTHOG_API_KEY=${{ secrets.POSTHOG_API_KEY }}" >> src-tauri/.env
          echo "POSTHOG_HOST=${{ secrets.POSTHOG_HOST }}" >> src-tauri/.env

      - name: Run Backend Tests with Coverage
        uses: xd009642/tarpaulin-action@v0.1.0
        with:
          args: '--ignore-tests --manifest-path src-tauri/Cargo.toml'

  test-e2e:
    needs: [test-frontend, test-backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      # Optimization: Added caching for Playwright browsers
      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps

      - name: Run E2E tests
        run: pnpm test:e2e

name: Release
on:
  push:
    branches:
      - main

jobs:
  # STEP 1: Determine version and create GitHub Release
  release-management:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Required to push tags and version commits
      issues: write     # Required to create failure issues
      pull-requests: write # Required to comment on PRs
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - uses: pnpm/action-setup@v4
        with:
          version: 9
          
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'pnpm'
          
      - name: Install dependencies
        run: pnpm install

      # FIX 1: Use the action wrapper to get outputs easily
      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          semantic_version: 19 # Or whichever version of semantic-release you prefer

  # STEP 2: Build the binaries for the version created above
  publish-tauri:
    needs: release-management
    # Only run if a new release was actually published
    if: needs.release-management.outputs.new_release_published == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main 
      
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev libusb-1.0-0-dev libgtk-3-dev libpcsclite-dev pkg-config

      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile

      # FIX 2: Manually set the version in tauri.conf.json/package.json 
      # This ensures the binary knows its own version, even if git pull didn't grab the semantic-release commit yet.
      - name: Update Version for Build
        shell: bash
        run: |
          npm version ${{ needs.release-management.outputs.new_release_version }} --no-git-tag-version --allow-same-version
          # If you use jq (available on all runners), update tauri.conf.json safely:
          jq '.package.version = "${{ needs.release-management.outputs.new_release_version }}"' src-tauri/tauri.conf.json > tmp.json && mv tmp.json src-tauri/tauri.conf.json

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # FIX 3: Point to the tag created by the previous job
          tagName: v${{ needs.release-management.outputs.new_release_version }}
          
          # IMPORTANT: We REMOVE 'releaseName', 'releaseBody', etc.
          # We let semantic-release handle the text. 
          # tauri-action will simply find the existing tag and attach assets.
          
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
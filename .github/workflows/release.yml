name: Release
on:
  push:
    branches:
      - main
      - beta # Added prerelease branch

jobs:
  # STEP 1: Determine version and create GitHub Release
  release-management:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Required to push tags and version commits
      issues: write     # Required to create failure issues
      pull-requests: write # Required to comment on PRs
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # DEBUG STEP: Check the logs for this step to see if a bad config file exists
      - name: Debug - List all files
        run: |
          echo "=== Current working directory: $(pwd) ==="
          ls -la
          echo "=== Searching for release config files ==="
          find . -maxdepth 2 -name "*release*"

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          semantic_version: 25

  # STEP 2: Build the binaries for the version created above
  publish-tauri:
    needs: release-management
    if: needs.release-management.outputs.new_release_published == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        # Removed `with: ref: main` so it checks out the branch that triggered the run

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev libusb-1.0-0-dev libgtk-3-dev libpcsclite-dev pkg-config

      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Create dummy binaries for non-Windows platforms
      - name: Create dummy binaries for macOS/Linux
        if: matrix.platform != 'windows-latest'
        run: |
          mkdir -p src-tauri/binaries
          touch src-tauri/binaries/sumatrapdf-x86_64-apple-darwin
          touch src-tauri/binaries/sumatrapdf-aarch64-apple-darwin
          touch src-tauri/binaries/sumatrapdf-x86_64-unknown-linux-gnu
          chmod +x src-tauri/binaries/*

      # Create dummy binaries for Windows (PowerShell) if they don't exist
      - name: Create dummy binaries for Windows
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries
          if (!(Test-Path "src-tauri/binaries/sumatrapdf-x86_64-pc-windows-msvc.exe")) {
            New-Item -ItemType File -Path "src-tauri/binaries/sumatrapdf-x86_64-pc-windows-msvc.exe"
          }
          if (!(Test-Path "src-tauri/binaries/sumatrapdf-i686-pc-windows-msvc.exe")) {
            New-Item -ItemType File -Path "src-tauri/binaries/sumatrapdf-i686-pc-windows-msvc.exe"
          }

      # Manually set the version using the output from Job 1
      - name: Update Version for Build
        shell: bash
        run: |
          FULL_VERSION="${{ needs.release-management.outputs.new_release_version }}"
          # Extract just the X.Y.Z part (removes -beta.1, etc.)
          CLEAN_VERSION="${FULL_VERSION%%-*}"
          
          echo "Bumping npm version to $FULL_VERSION"
          npm version $FULL_VERSION --no-git-tag-version --allow-same-version
          
          echo "Bumping Tauri config version to $CLEAN_VERSION to satisfy strict bundler rules"
          # Safely update tauri.conf.json with jq using the cleaned version
          jq --arg v "$CLEAN_VERSION" '.version = $v' src-tauri/tauri.conf.json > tmp.json && mv tmp.json src-tauri/tauri.conf.json

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v${{ needs.release-management.outputs.new_release_version }}
          releaseDraft: false
          # Dynamically set to prerelease if the branch is not 'main'
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          args: ${{ matrix.args }}
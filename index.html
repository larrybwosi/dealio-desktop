<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tauri + React + Typescript</title>
    
    <style>
      :root {
        --splash-bg: #0f172a;
        --splash-bg-gradient: radial-gradient(circle at 50% 0%, #1e293b, #0f172a);
        --splash-accent: #6366f1;
        --splash-text-muted: #94a3b8;
      }

      /* Base Splash Container */
      #splash-root {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: var(--splash-bg);
        background-image: var(--splash-bg-gradient);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.6s;
      }

      /* Background Pattern (Subtle Dot Grid) */
      .splash-pattern {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(#334155 1px, transparent 1px);
        background-size: 24px 24px;
        opacity: 0.1;
        pointer-events: none;
      }

      /* Content Wrapper */
      .splash-content {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        z-index: 10;
        animation: content-enter 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      }

      /* Logo Styling */
      .splash-logo {
        width: 120px;
        height: 120px; /* Adjust based on your logo aspect ratio */
        margin-bottom: 2.5rem;
        filter: drop-shadow(0 0 25px rgba(99, 102, 241, 0.15));
        object-fit: contain;
      }

      /* Loader Container */
      .splash-loader-track {
        width: 200px;
        height: 2px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 4px;
        overflow: hidden;
        position: relative;
      }

      /* Animated Progress Bar */
      .splash-loader-bar {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 100%;
        background: linear-gradient(90deg, transparent, var(--splash-accent), transparent);
        transform: translateX(-100%);
        animation: shimmer 1.5s infinite cubic-bezier(0.4, 0, 0.2, 1);
      }

      /* Status Text */
      .splash-status {
        margin-top: 1.5rem;
        font-size: 0.75rem;
        font-weight: 500;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--splash-text-muted);
        opacity: 0;
        animation: fade-in-up 0.5s ease-out 0.3s forwards;
      }

      /* Footer/Version Info */
      .splash-footer {
        position: absolute;
        bottom: 2rem;
        font-size: 0.7rem;
        color: rgba(148, 163, 184, 0.4);
        letter-spacing: 0.05em;
        animation: fade-in 1s ease-out 0.5s forwards;
        opacity: 0;
      }

      /* Animations */
      @keyframes content-enter {
        0% { opacity: 0; transform: translateY(10px) scale(0.98); }
        100% { opacity: 1; transform: translateY(0) scale(1); }
      }

      @keyframes shimmer {
        0% { transform: translateX(-100%); }
        50% { transform: translateX(100%); }
        100% { transform: translateX(100%); }
      }

      @keyframes fade-in-up {
        0% { opacity: 0; transform: translateY(5px); }
        100% { opacity: 1; transform: translateY(0); }
      }

      @keyframes fade-in {
        to { opacity: 1; }
      }

      /* Utility class to hide splash (added by JS) */
      .splash-hidden {
        opacity: 0 !important;
        visibility: hidden !important;
        pointer-events: none !important;
      }
    </style>
  </head>

  <body>
    <div id="splash-root">
      <div class="splash-pattern"></div>
      
      <div class="splash-content">
        <img src="/splashscreen-logo.png" alt="App Logo" class="splash-logo" />
        
        <div class="splash-loader-track">
          <div class="splash-loader-bar"></div>
        </div>
        
        <div class="splash-status">Initializing Application</div>
      </div>

      <div class="splash-footer">
        SECURE ENTERPRISE ENVIRONMENT &bull; V1.0.0
      </div>
    </div>

    <div id="root"></div>
    
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

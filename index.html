<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tauri + React + Typescript</title>
    
    <style>
      /* ENTERPRISE DESIGN SYSTEM 
        - Color Palette: Slate (Professional, Secure, Clean)
        - Accent: Indigo/Violet (Modern Tech feel)
      */
      /* ENTERPRISE DESIGN SYSTEM 
        - Color Palette: Slate (Professional, Secure, Clean)
        - Accent: Indigo/Violet (Modern Tech feel)
      */
      /* SPLASH VARIABLES */
      :root {
        --splash-bg: #0b1120;
        --splash-accent: #6366f1;
        --splash-glow: rgba(99, 102, 241, 0.4);
      }
      
      /* SPLASH CONTAINER */
      #splash-root {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
        transition: opacity 0.5s ease-out, visibility 0.5s;
      }

      /* PURE CSS GRID BACKGROUND (Subtle Tech Feel) */
      .splash-grid {
        position: absolute;
        inset: 0;
        background-image: 
          linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        background-size: 40px 40px;
        mask-image: radial-gradient(circle at center, black 40%, transparent 100%);
        -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 100%);
        pointer-events: none;
      }

      /* LOGO CONTAINER (Replaces the Image) */
      .brand-lockup {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 40px;
        animation: slide-up 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      }

      /* CSS-DRAWN ICON (Abstract 'POS' Chip Symbol) */
      .brand-icon {
        width: 48px;
        height: 48px;
        background: linear-gradient(135deg, var(--splash-accent), #4338ca);
        border-radius: 12px;
        position: relative;
        box-shadow: 0 0 30px var(--splash-glow);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      
      /* The "Chip" details inside the icon */
      .brand-icon::before {
        content: '';
        width: 24px;
        height: 24px;
        border: 2px solid rgba(255,255,255,0.9);
        border-radius: 6px;
      }
      .brand-icon::after {
        content: '';
        position: absolute;
        width: 8px;
        height: 8px;
        background: white;
        border-radius: 50%;
      }

      /* TYPOGRAPHY LOGO */
      .brand-text {
        display: flex;
        flex-direction: column;
        line-height: 1;
      }

      .brand-name {
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: white;
      }

      .brand-tagline {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        color: var(--splash-accent);
        margin-top: 4px;
      }

      /* LOADING BAR */
      .loader-container {
        width: 240px;
        height: 4px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 4px;
        overflow: hidden;
        position: relative;
      }

      .loader-progress {
        position: absolute;
        left: 0;
        top: 0;
        height: 100%;
        width: 100%;
        background: var(--splash-accent);
        transform: translateX(-100%);
        animation: progress 2s ease-in-out infinite;
        box-shadow: 0 0 10px var(--splash-accent);
      }

      /* STATUS TEXT */
      .status-text {
        margin-top: 16px;
        font-size: 13px;
        color: var(--text-secondary);
        font-family: monospace; /* Technical feel */
        opacity: 0.8;
      }

      /* FOOTER */
      .splash-footer {
        position: absolute;
        bottom: 32px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        font-size: 11px;
        color: rgba(148, 163, 184, 0.4);
        letter-spacing: 0.05em;
      }

      /* ANIMATIONS */
      @keyframes slide-up {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes progress {
        0% { transform: translateX(-100%); }
        50% { transform: translateX(0%); }
        100% { transform: translateX(100%); }
      }

      .splash-hidden {
        opacity: 0 !important;
        visibility: hidden !important;
      }
    </style>
  </head>

  <body>
    <div id="splash-root">
      <div class="splash-grid"></div>

      <div class="brand-lockup">
        <div class="brand-icon"></div>
        
        <div class="brand-text">
          <span class="brand-name">Dealio</span>
          <span class="brand-tagline">Enterprise POS</span>
        </div>
      </div>

      <div class="loader-container">
        <div class="loader-progress"></div>
      </div>
      
      <div class="status-text">Initializing Secure Environment...</div>

      <div class="splash-footer">
        <span>ENCRYPTED CONNECTION &bull; V2.4.0</span>
      </div>
    </div>
    <div id="root"></div>
    
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

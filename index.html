<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tauri + React + Typescript</title>
  </head>

  <body>
    <div id="splash-root" style="position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #0f172a; z-index: 9999; transition: opacity 0.5s ease-out; pointer-events: none;">
      <div style="text-align: center;">
          <img src="/splashscreen-logo.png" style="width: 200px; margin-bottom: 2rem; filter: drop-shadow(0 0 20px rgba(99, 102, 241, 0.3));">
          <div style="width: 240px; height: 4px; background: rgba(255, 255, 255, 0.1); border-radius: 2px; overflow: hidden; margin: 0 auto;">
              <div style="width: 100%; height: 100%; background: linear-gradient(90deg, #6366f1, #a855f7); transform-origin: left; animation: splash-loading 2s infinite ease-in-out;"></div>
          </div>
          <div style="margin-top: 1rem; font-size: 0.875rem; color: #94a3b8; font-family: sans-serif; letter-spacing: 0.05em; text-transform: uppercase;">Initializing...</div>
      </div>
    </div>
    <style>
        @keyframes splash-loading {
            0% { transform: scaleX(0) translateX(0); }
            50% { transform: scaleX(0.5) translateX(100%); }
            100% { transform: scaleX(0) translateX(200%); }
        }
    </style>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
